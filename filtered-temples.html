<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Filtered Temple Album | WDD 131</title>

    <meta
        name="description"
        content="A responsive temple album that dynamically displays and filters temples by age and size."
    >

    <meta name="author" content="Maximiliano Correa">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles/filtered-temples.css">


    <script src="scripts/filtered-temples.js" defer></script>
</head>

<body>
    <header>
        <div class="header-container">
            <span class="site-title">Temple Album</span>

            <button
                id="menu"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
            >
                ☰
            </button>

            <nav id="navigation" aria-label="Temple filters">
                <button type="button" data-filter="home" class="active">
                    Home
                </button>

                <button type="button" data-filter="old">
                    Old
                </button>

                <button type="button" data-filter="new">
                    New
                </button>

                <button type="button" data-filter="large">
                    Large
                </button>

                <button type="button" data-filter="small">
                    Small
                </button>
            </nav>
        </div>
    </header>

    <main>
        <h1 id="page-title">Home</h1>

        <section
            id="temple-cards"
            class="temple-grid"
            aria-label="Temple album"
        >
            <!-- Temple cards are generated with JavaScript -->
        </section>
    </main>

    <footer>
        <p>
            &copy;
            <span id="currentyear"></span>
            🌎 Maximiliano Correa 🌎 Argentina
        </p>

        <p id="lastModified"></p>
    </footer>
</body>
</html>
