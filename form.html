<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review | WDD 131</title>

    <meta
        name="description"
        content="Submit a product review including product rating, installation date, useful features, and comments."
    >
    <meta name="author" content="Maximiliano Correa">

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <!-- Product Name -->
            <div class="form-group">
                <label for="product">
                    Product Name
                    <span class="required">*</span>
                </label>

                <select
                    id="product"
                    name="product"
                    required
                >
                    <option value="" disabled selected>
                        Select a Product ...
                    </option>
                </select>
            </div>

            <!-- Overall Rating -->
            <fieldset>
                <legend>
                    Overall Rating
                    <span class="required">*</span>
                </legend>

                <div class="rating">

                    <label for="rating1">
                        <span>1</span>
                        <span class="star">☆</span>
                    </label>
                    <input
                        type="radio"
                        id="rating1"
                        name="rating"
                        value="1"
                        required
                    >

                    <label for="rating2">
                        <span>2</span>
                        <span class="star">☆</span>
                    </label>
                    <input
                        type="radio"
                        id="rating2"
                        name="rating"
                        value="2"
                        required
                    >

                    <label for="rating3">
                        <span>3</span>
                        <span class="star">☆</span>
                    </label>
                    <input
                        type="radio"
                        id="rating3"
                        name="rating"
                        value="3"
                        required
                    >

                    <label for="rating4">
                        <span>4</span>
                        <span class="star">☆</span>
                    </label>
                    <input
                        type="radio"
                        id="rating4"
                        name="rating"
                        value="4"
                        required
                    >

                    <label for="rating5">
                        <span>5</span>
                        <span class="star">☆</span>
                    </label>
                    <input
                        type="radio"
                        id="rating5"
                        name="rating"
                        value="5"
                        required
                    >

                </div>
            </fieldset>

            <!-- Installation Date -->
            <div class="form-group">
                <label for="installation">
                    Date of Installation
                    <span class="required">*</span>
                </label>

                <input
                    type="date"
                    id="installation"
                    name="installation"
                    required
                >
            </div>

            <!-- Useful Features -->
            <fieldset>
                <legend>
                    Which features did you find useful?
                    <span class="optional">(Check all that apply)</span>
                </legend>

                <div class="checkbox-group">

                    <label for="durability">
                        <input
                            type="checkbox"
                            id="durability"
                            name="features"
                            value="durability"
                        >
                        Durability
                    </label>

                    <label for="ease-of-use">
                        <input
                            type="checkbox"
                            id="ease-of-use"
                            name="features"
                            value="ease-of-use"
                        >
                        Ease of Use
                    </label>

                    <label for="performance">
                        <input
                            type="checkbox"
                            id="performance"
                            name="features"
                            value="performance"
                        >
                        Performance
                    </label>

                    <label for="design">
                        <input
                            type="checkbox"
                            id="design"
                            name="features"
                            value="design"
                        >
                        Design
                    </label>

                </div>
            </fieldset>

            <!-- Written Review -->
            <div class="form-group">
                <label for="review">
                    Written Review
                    <span class="optional">(Optional)</span>
                </label>

                <textarea
                    id="review"
                    name="review"
                    rows="6"
                    placeholder="Tell us about your experience with this product..."
                ></textarea>
            </div>

            <!-- User Name -->
            <div class="form-group">
                <label for="username">
                    Your Name
                    <span class="optional">(Optional)</span>
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="name"
                >
            </div>

            <!-- Submit -->
            <input
                type="submit"
                value="Submit Product Review"
                class="submit-button"
            >

        </form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            | Maximiliano Correa
            | Argentina
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
